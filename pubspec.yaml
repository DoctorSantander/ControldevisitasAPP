name: escaner_fichas_clinicas
description: "App móvil para escanear y procesar fichas clínicas por lotes con IA local y exportar a CSV."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0
  path_provider: ^2.1.4
  csv: ^6.0.0
  permission_handler: ^11.3.1
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
